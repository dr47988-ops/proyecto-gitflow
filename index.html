<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto GitFlow</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Proyecto GitFlow</h1>
    <p>Demostración práctica de GitFlow</p>

    <h2>Formulario de Contacto</h2>

    <form>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" placeholder="Ingrese su nombre"><br><br>

        <label for="correo">Correo:</label><br>
        <input type="email" id="correo" placeholder="Ingrese su correo"><br><br>

        <button type="button" id="btnEnviar">Enviar</button>
    </form>

    <script src="app.js"></script>

</body>
</html>
